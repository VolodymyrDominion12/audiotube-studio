[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiotube-studio"
version = "0.2.0"
description = "Локальний конвеєр: аудіорозбори -> YouTube-відео з фоном, обкладинкою і плейлистами"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
    "google-auth-httplib2>=0.1",
]

[project.optional-dependencies]
# av<16: PyAV 16+ прибрав metadata_errors, який використовує faster-whisper 1.2.x
transcribe = ["faster-whisper>=1.1", "av>=11,<16"]
dev = ["pytest>=7"]

[project.scripts]
audiotube = "audiotube.cli:main"

[tool.setuptools.packages.find]
include = ["audiotube*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
